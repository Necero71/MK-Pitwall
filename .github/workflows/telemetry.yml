name: Telemetry APK

# Builds the native telemetry app in telemetry/ and runs its unit tests.
# The debug APK is uploaded as a workflow artifact (Actions tab > run > Artifacts).

on:
  push:
    paths: ['telemetry/**', '.github/workflows/telemetry.yml']
  pull_request:
    paths: ['telemetry/**', '.github/workflows/telemetry.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telemetry
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mk-telemetry-debug-${{ github.run_number }}
          path: telemetry/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: telemetry-test-reports-${{ github.run_number }}
          path: telemetry/app/build/reports/
          retention-days: 7
