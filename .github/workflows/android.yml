name: Android APK

# Release:  git tag v1.0.0 && git push origin v1.0.0   (builds a SIGNED APK and publishes a GitHub Release)
# Test:     Actions tab > Android APK > Run workflow   (builds DEBUG APKs as downloadable artifacts only)
# Builds both apps in this repo: MK PITWALL (android/) and MK Telemetry (telemetry/).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_SLUG: mk-pitwall
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Work out version
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            if ! echo "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Tag must look like v1.2.3 (got $REF_NAME)"; exit 1
            fi
            V="${REF_NAME#v}"
            IFS=. read -r MA MI PA <<< "$V"
            # 1.2.3 -> 10203. Always goes up as long as the tag does, which Android requires for updates.
            CODE=$(( MA * 10000 + MI * 100 + PA ))
          else
            V="0.0.0-dev.$RUN_NUMBER"
            CODE="$RUN_NUMBER"
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Install and sync web files into the Android project
        run: |
          npm ci
          npm run sync

      - name: Decode signing keystore
        id: key
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secrets set: building a debug APK for testing only."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          SIGNED: ${{ steps.key.outputs.signed }}
          V_NAME: ${{ steps.ver.outputs.name }}
          V_CODE: ${{ steps.ver.outputs.code }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "true" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          ./gradlew "$TASK" -PversionCode="$V_CODE" -PversionName="$V_NAME" --no-daemon

      - name: Collect APK
        id: apk
        env:
          SIGNED: ${{ steps.key.outputs.signed }}
          V_NAME: ${{ steps.ver.outputs.name }}
        run: |
          if [ "$SIGNED" = "true" ]; then SRC=$(ls android/app/build/outputs/apk/release/*.apk); SUFFIX=""; else SRC=$(ls android/app/build/outputs/apk/debug/*.apk); SUFFIX="-DEBUG"; fi
          OUT="${APP_SLUG}-v${V_NAME}${SUFFIX}.apk"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Build MK Telemetry APK
        working-directory: telemetry
        env:
          SIGNED: ${{ steps.key.outputs.signed }}
          V_NAME: ${{ steps.ver.outputs.name }}
          V_CODE: ${{ steps.ver.outputs.code }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "true" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          ./gradlew "$TASK" -PversionCode="$V_CODE" -PversionName="$V_NAME" --no-daemon

      - name: Collect MK Telemetry APK
        id: tapk
        env:
          SIGNED: ${{ steps.key.outputs.signed }}
          V_NAME: ${{ steps.ver.outputs.name }}
        run: |
          if [ "$SIGNED" = "true" ]; then SRC=$(ls telemetry/app/build/outputs/apk/release/*.apk); SUFFIX=""; else SRC=$(ls telemetry/app/build/outputs/apk/debug/*.apk); SUFFIX="-DEBUG"; fi
          OUT="mk-telemetry-v${V_NAME}${SUFFIX}.apk"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Check the APK is really signed (release only)
        if: steps.key.outputs.signed == 'true'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "${{ steps.apk.outputs.file }}"
          "$BT/apksigner" verify --print-certs "${{ steps.tapk.outputs.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tapk.outputs.file }}
          path: ${{ steps.tapk.outputs.file }}
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' && steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FILE: ${{ steps.apk.outputs.file }}
          TFILE: ${{ steps.tapk.outputs.file }}
        run: gh release create "$TAG" "$FILE" "$TFILE" --title "$TAG" --generate-notes
