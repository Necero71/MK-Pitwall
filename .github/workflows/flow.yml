name: MK Flow APK

# Builds the MK Flow TV launcher in flow/.
# The APKs are uploaded as a workflow artifact (Actions tab > run > Artifacts).
# The release APK is signed with the debug key, so it sideloads straight onto the TV stick.

on:
  push:
    paths: ['flow/**', '.github/workflows/flow.yml']
  pull_request:
    paths: ['flow/**', '.github/workflows/flow.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mk-flow-${{ github.run_number }}
          path: flow/app/build/outputs/apk/*/*.apk
          retention-days: 14
